<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1222"><title>Life Notes</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--panel2:#202020;--line:#303030;--text:#f2f2f2;--muted:#a2a2a2;--blue:#d6d6d6;--green:#b7d6c4;--gold:#e7d7a2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:100px}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}header{padding:28px 20px 12px;max-width:850px;margin:auto}header .eyebrow{color:#91aaff;text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:800}h1{font-size:30px;line-height:1.1;margin:7px 0}h2{font-size:22px;margin:0 0 10px}h3{margin:0;font-size:17px}.muted,.sub{color:var(--muted)}main{max-width:850px;margin:auto;padding:8px 16px 28px}.card{background:linear-gradient(145deg,rgba(24,35,58,.97),rgba(17,25,43,.97));border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 12px 30px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.btn{border:1px solid #405579;background:#223252;border-radius:14px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);border-color:#91aaff;color:white}.quiet{background:transparent}.pill{display:inline-block;background:#243351;border-radius:99px;padding:4px 10px;color:#c9d6ff;font-size:12px;font-weight:800}.progress{height:9px;background:#27334c;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6b91ff,#4bd59a);border-radius:99px;transition:width .35s}.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #293550}.task:last-child{border-bottom:0}.check{width:25px;height:25px;flex:none;accent-color:#62d7a3}.task .name{font-weight:700}.task.done .name{text-decoration:line-through;color:#94a2bc}.task small{display:block;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#1b2943;border-radius:16px;padding:14px}.stat strong{display:block;font-size:23px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:650;color:#c7d2e8}.field input,.field textarea,.field select,.search{width:100%;background:#0e1628;color:var(--text);border:1px solid #344461;border-radius:13px;padding:12px;outline:none}.field textarea{min-height:90px;resize:vertical}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:5px;justify-content:space-around;padding:10px 7px calc(10px + env(safe-area-inset-bottom));background:#101010f2;border-top:1px solid #303030;backdrop-filter:blur(18px);z-index:5}.nav button{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:13px;padding:8px 2px;color:var(--muted);font-size:11px;font-weight:800}.nav button span{display:block;font-size:19px}.nav button.active{background:#26385d;border-color:#5875b5;color:white}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#22304b;color:#c7d3eb;border:1px solid #344666;border-radius:99px;padding:6px 10px;font-size:13px}.chip.on{background:#354f87;border-color:#7797ff;color:white}.empty{text-align:center;color:var(--muted);padding:22px 8px}.small{font-size:13px}.goal{padding:13px 0;border-bottom:1px solid #293550}.goal:last-child{border:0}.notice{border-left:3px solid var(--green);padding:8px 12px;background:#16362f;border-radius:0 10px 10px 0;color:#c6f7e2}.modal{position:fixed;inset:0;background:#050914d9;z-index:10;display:grid;align-items:end;padding:12px}.sheet{background:#151e32;border:1px solid #3a4b6c;border-radius:24px 24px 18px 18px;padding:20px;max-height:88dvh;overflow:auto;width:min(100%,650px);margin:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.hidden{display:none!important}a{color:#a9c0ff}@media(min-width:650px){main{padding-inline:24px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.nav{left:50%;right:auto;transform:translateX(-50%);width:min(850px,100%);border:1px solid #2c3955;border-bottom:0;border-radius:18px 18px 0 0}}
</style></head><body>
<header><div class="eyebrow">Your life, one day at a time</div><h1>Life Notes</h1><div class="sub" id="headerDate"></div></header><main id="app"></main><nav class="nav" id="nav"></nav><div id="modalRoot"></div>
<script>
const KEY='lifeResetHQ_v1',OLD=['lifegame_v11','lifegame_v09','lifegame_v06'];
const CATS=[['faith','✝️','Faith'],['health','💪','Health'],['cooking','🍳','Cooking'],['learning','📚','Learning'],['career','👨‍🍳','Career'],['money','💰','Money'],['relationships','🤝','Relationships'],['home','🧹','Home'],['enjoyment','🌱','Experiences']];
const HABITS=[
{id:'bible',title:'Read the Bible',cat:'faith',xp:20},{id:'prayer',title:'Pray honestly and reflect',cat:'faith',xp:20},{id:'quiet',title:'A few quiet minutes',cat:'faith',xp:10},
{id:'mobility',title:'Morning mobility',cat:'health',xp:15},{id:'nutrition',title:'Balanced meals & water',cat:'health',xp:15},{id:'movement',title:'Train, walk or recover',cat:'health',xp:20},{id:'stretch',title:'Evening stretching',cat:'health',xp:15},
{id:'learn',title:'Read or study something useful',cat:'learning',xp:20},{id:'brain',title:'Focus, memory or mental arithmetic',cat:'learning',xp:15},{id:'priorities',title:'Check today’s priorities',cat:'home',xp:10},{id:'tomorrow',title:'Prepare for tomorrow',cat:'home',xp:10}];
const RESET=['Review completed and unfinished tasks','Check spending, savings and upcoming expenses','Plan groceries and meals','Review training, recovery and mobility','Reflect on Bible reading, prayer and church','Check work preparation and career progress','Contact family or friends','Tidy room and handle laundry','Choose next week’s 3–5 priorities'];
const REVIEW=[['wentWell','What went well?'],['attention','What needs attention?'],['learned','What did I learn about myself?'],['heldBack','What held me back?'],['change','What should I stop, simplify or change?'],['grateful','What am I grateful for?'],['faith','How did I care for my faith and relationship with Jesus?'],['health','How did I care for physical and mental health?'],['goals','How did I progress toward my goals?'],['focus','What is my main focus for next week?']];
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekStart(d=new Date()){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return dateKey(x)}
function addDays(key,n){let [y,m,d]=key.split('-').map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return dateKey(x)}
function fmt(k,opts={day:'numeric',month:'short'}){return new Date(k+'T12:00:00').toLocaleDateString(undefined,opts)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function blank(){return {schema:1,xp:0,coins:0,catXP:{},habits:{},tasks:[],weeks:{},reviews:{},goals:[],projects:[],parking:[],activity:[],achievements:[],notes:{},settings:{gamification:true}}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)return Object.assign(blank(),s)}catch(e){}let old=null;for(const k of OLD){try{old=JSON.parse(localStorage.getItem(k)||'null');if(old)break}catch(e){}}let s=blank();if(old){s.xp=Number(old.xp)||0;s.coins=Number(old.coins)||0;s.legacy={importedAt:new Date().toISOString(),oldSchema:old.schema||'legacy'};s.legacyTasks=Array.isArray(old.tasks)?old.tasks:[];s.legacyHistory=Array.isArray(old.history)?old.history:[];s.legacyCompletions=old.completions||{};s.legacyCat=old.cat||{};s.legacyStreak=old.streak||0;}return s}
let db=load(),page='today',searchReviews='',toastTimer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save locally. Please export a backup and free browser storage.');return false}}
function todayHabitRecords(day=dateKey()){return db.habits[day]||(db.habits[day]={})}
function taskDone(t){return t.status==='completed'}
function weekData(w=weekStart()){return db.weeks[w]||(db.weeks[w]={priorities:[],focus:'',intention:'',reset:{},createdAt:new Date().toISOString()})}
function levelInfo(xp){let l=0;while(xp>=Math.round(100*Math.pow(l+1,1.45)))l++;let base=l?Math.round(100*Math.pow(l,1.45)):0,next=Math.round(100*Math.pow(l+1,1.45));return {level:l,base,next,into:xp-base,need:next-base}}
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:#26385d;border:1px solid #7594e9;padding:11px 16px;border-radius:14px;box-shadow:0 10px 30px #0008';document.body.appendChild(el)}el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}
function reward(id,title,cat,xp){let key=dateKey()+'|'+id;if(db.activity.some(a=>a.key===key))return;db.xp+=xp;db.coins+=Math.max(1,Math.floor(xp/2));db.catXP[cat]=(db.catXP[cat]||0)+xp;db.activity.push({key,title,cat,xp,date:dateKey(),at:new Date().toISOString()});checkAchievements();save()}
function checkAchievements(){let checks=[['first','First step',db.activity.length>=1],['weekreview','First weekly reflection',Object.keys(db.reviews).length>=1],['reflections10','Ten weekly reflections',Object.keys(db.reviews).length>=10],['goal','First master goal completed',db.goals.some(g=>g.status==='completed')],['project','First project finished',db.projects.some(p=>p.status==='completed')]];checks.forEach(([id,name,ok])=>{if(ok&&!db.achievements.includes(id)){db.achievements.push(id);toast('Achievement unlocked: '+name+' 🏆')}})}
function nav(){let items=[['today','☀️','Today'],['week','📅','This Week'],['reviews','📖','History'],['goals','🧭','Life Plan']];document.getElementById('nav').innerHTML=items.map(([id,ic,n])=>'<button class="'+((page===id||(id==='goals'&&(page==='projects'||page==='progress')))?'active':'')+'" onclick="go(\''+id+'\')"><span>'+ic+'</span>'+n+'</button>').join('')}
function go(p){page=p;render()}
function render(){document.getElementById('headerDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});nav();let f={today:todayPage,week:weekPage,reviews:reviewsPage,goals:goalsPage,projects:projectsPage,progress:progressPage};document.getElementById('app').innerHTML=f[page]();if(page==='today'){}}
function card(title,body,extra=''){return '<section class="card"><div class="row"><h2>'+title+'</h2>'+extra+'</div>'+body+'</section>'}
function taskRow(t,done,click){return '<div class="task '+(done?'done':'')+'"><input class="check" type="checkbox" '+(done?'checked':'')+' onchange="'+click+'" aria-label="Complete '+esc(t.title)+'"><div style="flex:1"><div class="name">'+esc(t.title)+'</div><small>'+esc(catName(t.cat))+(t.xp?' · '+t.xp+' XP':'')+'</small></div></div>'}
function catName(k){let c=CATS.find(x=>x[0]===k);return c?c[2]:'General'}
function todayPage(){let day=dateKey(),h=todayHabitRecords(day),completed=HABITS.filter(x=>h[x.id]?.status==='done').length,one=db.tasks.filter(t=>t.date===day&&t.status!=='cancelled'),done=one.filter(taskDone).length,total=HABITS.length+one.length,pct=total?Math.round((completed+done)/total*100):0,important=one.filter(t=>t.priority==='High'&&t.status!=='completed');return '<div class="card"><div class="row"><div><div class="eyebrow">Today · '+fmt(day,{weekday:'long',day:'numeric',month:'long'})+'</div><h2 style="margin-top:8px">Small steps. Real progress.</h2></div><span class="pill">'+pct+'% done</span></div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="muted small">'+completed+' of '+HABITS.length+' foundations · '+done+' of '+one.length+' planned tasks</div></div>'+(important.length?card('⭐ Top priority',important.map(t=>'<div class="task"><div style="flex:1"><b>'+esc(t.title)+'</b><small>Due today</small></div><button class="btn" onclick="finishTask(\''+t.id+'\')">Done</button></div>').join('')):'')+card('Daily foundations','<p class="muted small">Your checklist renews each day. Previous dates stay saved.</p>'+HABITS.map(t=>taskRow(t,h[t.id]?.status==='done','habitToggle(\''+t.id+'\',this.checked)')).join(''),'<span class="pill">'+completed+'/'+HABITS.length+'</span>')+card('Tasks for today','<div class="muted small">One-off tasks stay separate from your recurring habits.</div>'+(one.length?one.map(t=>'<div class="task '+(taskDone(t)?'done':'')+'"><input class="check" type="checkbox" '+(taskDone(t)?'checked':'')+' onchange="finishTask(\''+t.id+'\')"><div style="flex:1"><div class="name">'+esc(t.title)+'</div><small>'+esc(t.priority||'Normal')+' priority'+(t.goalId?' · linked goal':'')+'</small></div><button class="btn quiet" onclick="editTask(\''+t.id+'\')">Edit</button></div>').join(''):'<div class="empty">Nothing else scheduled. Keep the day intentional.</div>')+'<button class="btn primary" onclick="taskModal(\''+day+'\')">＋ Add task for today</button>')+card('Remember','<textarea class="field search" placeholder="A thought, reminder or note for today…" onchange="saveDayNote(this.value)">'+esc(db.notes[day]||'')+'</textarea><div class="muted small">Saved on this device as you leave the field.</div>')}
function habitToggle(id,checked){let r=todayHabitRecords();let prev=r[id]?.status==='done';if(prev===checked)return;if(checked){r[id]={status:'done',at:new Date().toISOString()};let h=HABITS.find(x=>x.id===id);reward('habit:'+id,h.title,h.cat,h.xp)}else{r[id]={status:'open'};reverseReward('habit:'+id)}save();render()}
function reverseReward(id){let k=dateKey()+'|'+id,idx=db.activity.findIndex(a=>a.key===k);if(idx>=0){let a=db.activity[idx];db.xp=Math.max(0,db.xp-a.xp);db.coins=Math.max(0,db.coins-Math.max(1,Math.floor(a.xp/2)));db.catXP[a.cat]=Math.max(0,(db.catXP[a.cat]||0)-a.xp);db.activity.splice(idx,1)}}
function saveDayNote(v){db.notes[dateKey()]=v;save();toast('Note saved')}
function taskModal(day,id=''){let t=db.tasks.find(x=>x.id===id)||{};openModal('<h2>'+(id?'Edit task':'Add a task')+'</h2><div class="field"><label>Task name</label><input id="tmTitle" value="'+esc(t.title||'')+'" placeholder="What needs doing?"></div><div class="field"><label>Category</label><select id="tmCat">'+CATS.map(c=>'<option value="'+c[0]+'" '+((t.cat||'home')===c[0]?'selected':'')+'>'+c[1]+' '+c[2]+'</option>').join('')+'</select></div><div class="grid"><div class="field"><label>Due date</label><input id="tmDate" type="date" value="'+esc(t.date||day)+'"></div><div class="field"><label>Priority</label><select id="tmPriority">'+['Low','Normal','High'].map(x=>'<option '+((t.priority||'Normal')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="field"><label>Link to a master goal (optional)</label><select id="tmGoal"><option value="">No linked goal</option>'+db.goals.filter(g=>g.status!=='completed').map(g=>'<option value="'+g.id+'" '+(t.goalId===g.id?'selected':'')+'>'+esc(g.title)+'</option>').join('')+'</select></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask(\''+id+'\')">Save task</button></div>')}
function saveTask(id){let title=document.getElementById('tmTitle').value.trim();if(!title){toast('Give your task a name');return}let obj={id:id||'t'+Date.now(),title,cat:document.getElementById('tmCat').value,date:document.getElementById('tmDate').value||dateKey(),priority:document.getElementById('tmPriority').value,goalId:document.getElementById('tmGoal').value,status:'planned',xp:20};if(id){let old=db.tasks.find(t=>t.id===id);obj.status=old.status;obj.completedAt=old.completedAt;db.tasks=db.tasks.map(t=>t.id===id?obj:t)}else db.tasks.push(obj);save();closeModal();render();toast('Task saved')}
function editTask(id){let t=db.tasks.find(t=>t.id===id);taskModal(t.date,id)}
function finishTask(id){let t=db.tasks.find(t=>t.id===id);if(!t)return;if(t.status==='completed'){t.status='planned';t.completedAt=null;reverseReward('task:'+id)}else{t.status='completed';t.completedAt=new Date().toISOString();reward('task:'+id,t.title,t.cat,t.xp||20)}save();render()}
function weekPage(){let w=weekStart(),d=weekData(w),days=Array.from({length:7},(_,i)=>addDays(w,i)),tasks=db.tasks.filter(t=>t.date>=w&&t.date<=days[6]&&t.status!=='cancelled'),finished=tasks.filter(taskDone).length;return '<div class="card"><div class="eyebrow">Weekly command centre</div><h2>'+fmt(w,{day:'numeric',month:'short'})+' – '+fmt(days[6],{day:'numeric',month:'short',year:'numeric'})+'</h2><div class="progress"><i style="width:'+(tasks.length?finished/tasks.length*100:0)+'%"></i></div><div class="muted small">'+finished+' of '+tasks.length+' weekly tasks completed. Your previous weeks remain saved.</div></div>'+card('🎯 This week’s priorities','<p class="muted small">Choose up to five. New weeks start fresh; unfinished work is never silently carried over.</p>'+[0,1,2,3,4].map((i)=>'<div class="field"><label>Priority '+(i+1)+'</label><input value="'+esc(d.priorities[i]||'')+'" placeholder="The most important outcome…" onchange="setPriority('+i+',this.value)"></div>').join('')+'<div class="field"><label>Weekly focus</label><input value="'+esc(d.focus||'')+'" placeholder="What matters most this week?" onchange="setWeekField(\'focus\',this.value)"></div><div class="field"><label>Weekly intention (optional)</label><textarea onchange="setWeekField(\'intention\',this.value)" placeholder="How do you want to approach the week?">'+esc(d.intention||'')+'</textarea></div>')+card('🗓️ Week at a glance',days.map((day,i)=>{let ts=tasks.filter(t=>t.date===day);return '<div class="goal"><div class="row"><b>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]+' · '+fmt(day)+'</b><span class="pill">'+ts.filter(taskDone).length+'/'+ts.length+'</span></div>'+(ts.length?ts.map(t=>'<div class="small '+(taskDone(t)?'muted':'')+'">'+(taskDone(t)?'✓':'○')+' '+esc(t.title)+'</div>').join(''):'<div class="muted small">No tasks planned</div>')+'<button class="btn quiet small" onclick="taskModal(\''+day+'\')">＋ Add task</button></div>'}).join(''))+card('🔄 Weekly reset checklist','<p class="muted small">Each week has its own checklist. Nothing here overwrites last week.</p>'+RESET.map((t,i)=>'<div class="task"><input class="check" type="checkbox" '+(d.reset[i]?'checked':'')+' onchange="setReset('+i+',this.checked)"><div>'+esc(t)+'</div></div>').join('')+'<div class="actions"><button class="btn primary" onclick="go(\'reviews\')">Write weekly review →</button></div>')+card('↪ Review unfinished tasks','<p class="muted small">These are earlier tasks still open. Choose what deserves another date.</p>'+db.tasks.filter(t=>t.date<w&&t.status!=='completed'&&t.status!=='cancelled').slice(0,20).map(t=>'<div class="task"><div style="flex:1"><b>'+esc(t.title)+'</b><small>Was due '+fmt(t.date)+'</small></div><button class="btn" onclick="reschedule(\''+t.id+'\')">Reschedule</button></div>').join('')||'<div class="empty">No overdue tasks to review.</div>')}
function setPriority(i,v){let d=weekData();d.priorities[i]=v;d.priorities=d.priorities.slice(0,5);save()}function setWeekField(k,v){weekData()[k]=v;save()}function setReset(i,v){weekData().reset[i]=v;save()}function reschedule(id){let t=db.tasks.find(t=>t.id===id);taskModal(dateKey(),id);setTimeout(()=>{let el=document.getElementById('tmDate');if(el)el.value=dateKey()},0)}
function reviewsPage(){let w=weekStart(),r=db.reviews[w]||{},keys=Object.keys(db.reviews).sort().reverse(),q=searchReviews.toLowerCase(),filtered=keys.filter(k=>{let x=db.reviews[k];return (k+' '+REVIEW.map(([id])=>x[id]||'').join(' ')).toLowerCase().includes(q)});return '<div class="card"><div class="eyebrow">Your personal journal</div><h2>Weekly history</h2><p class="muted">Every week has its own reflection. Nothing gets overwritten when a new week begins.</p><span class="pill">'+keys.length+' saved weeks</span></div><section class="card"><div class="row"><h2>Review · Week of '+fmt(w)+'</h2><span class="pill">'+(r.completed?'Saved':'Draft')+'</span></div>'+REVIEW.map(([id,label])=>'<div class="field"><label>'+label+'</label><textarea placeholder="Write what feels true…" oninput="saveReviewField(\''+w+'\',\''+id+'\',this.value)">'+esc(r[id]||'')+'</textarea></div>').join('')+'<div class="field"><label>Next week’s three main priorities</label>'+[0,1,2].map(i=>'<input placeholder="Priority '+(i+1)+'" value="'+esc((r.nextPriorities||[])[i]||'')+'" oninput="saveReviewPriority(\''+w+'\','+i+',this.value)" style="margin-bottom:7px">').join('')+'</div><button class="btn primary" onclick="completeReview(\''+w+'\')">Save weekly review ✓</button></section><div class="section-title"><h2>Past reviews</h2></div><input class="search" placeholder="Search reflections…" value="'+esc(searchReviews)+'" oninput="searchReviews=this.value;render()">'+(filtered.length?filtered.map(k=>{let x=db.reviews[k];return '<section class="card"><div class="row"><div><h3>Week of '+fmt(k,{day:'numeric',month:'long',year:'numeric'})+'</h3><div class="muted small">'+(x.completed?'Completed review':'Draft')+' · '+(x.nextPriorities||[]).filter(Boolean).length+' next priorities</div></div><button class="btn" onclick="jumpReview(\''+k+'\')">Open</button></div><p class="muted">'+esc((x.wentWell||x.focus||'No reflection text yet').slice(0,150))+'</p></section>'}).join(''):'<div class="empty">No saved reviews match that search.</div>')}
function saveReviewField(w,k,v){if(!db.reviews[w])db.reviews[w]={createdAt:new Date().toISOString(),weekStart:w};db.reviews[w][k]=v;db.reviews[w].updatedAt=new Date().toISOString();save()}function saveReviewPriority(w,i,v){if(!db.reviews[w])db.reviews[w]={createdAt:new Date().toISOString(),weekStart:w};let a=db.reviews[w].nextPriorities||[];a[i]=v;db.reviews[w].nextPriorities=a;db.reviews[w].updatedAt=new Date().toISOString();save()}function completeReview(w){saveReviewField(w,'completed',true);checkAchievements();save();toast('Weekly reflection saved');render()}function jumpReview(w){page='reviews';render();setTimeout(()=>{let el=[...document.querySelectorAll('textarea')].find(x=>x.value);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},40)}
function goalsPage(){return '<div class="card"><div class="eyebrow">Your direction</div><h2>Life plan</h2><p class="muted">These are the things you are building over months and years — not a checklist you need to finish today.</p><div class="actions"><button class="btn primary" onclick="goalModal()">＋ Add goal</button><button class="btn" onclick="go(\'projects\')">Projects</button><button class="btn" onclick="go(\'progress\')">Progress</button></div></div>'+CATS.map(c=>{let gs=db.goals.filter(g=>g.cat===c[0]&&g.status!=='archived');return '<section class="card"><div class="row"><h2>'+c[1]+' '+c[2]+'</h2><span class="pill">'+gs.length+'</span></div>'+(gs.length?gs.map(g=>'<div class="goal"><div class="row"><b>'+esc(g.title)+'</b><span class="pill">'+esc(g.status)+'</span></div>'+(g.target?'<div class="muted small">Target: '+esc(g.target)+'</div>':'')+(g.notes?'<p class="muted small">'+esc(g.notes)+'</p>':'')+'<div class="actions"><button class="btn" onclick="promoteGoal(\''+g.id+'\')">Make project</button><button class="btn quiet" onclick="goalModal(\''+g.id+'\')">Edit</button><button class="btn quiet" onclick="archiveGoal(\''+g.id+'\')">Archive</button></div></div>').join(''):'<div class="empty">No goals yet in this category.</div>')+'</section>'}).join('')}
function goalModal(id=''){let g=db.goals.find(x=>x.id===id)||{};openModal('<h2>'+(id?'Edit goal':'New master goal')+'</h2><div class="field"><label>Goal</label><input id="gTitle" value="'+esc(g.title||'')+'" placeholder="What do you want to build?"></div><div class="field"><label>Category</label><select id="gCat">'+CATS.map(c=>'<option value="'+c[0]+'" '+((g.cat||'faith')===c[0]?'selected':'')+'>'+c[1]+' '+c[2]+'</option>').join('')+'</select></div><div class="field"><label>Status</label><select id="gStatus">'+['someday','active','on hold','completed'].map(s=>'<option '+((g.status||'someday')===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field"><label>Target date (optional)</label><input id="gTarget" type="date" value="'+esc(g.target||'')+'"></div><div class="field"><label>Notes</label><textarea id="gNotes">'+esc(g.notes||'')+'</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveGoal(\''+id+'\')">Save goal</button></div>')}
function saveGoal(id){let title=document.getElementById('gTitle').value.trim();if(!title)return toast('Add a goal name');let obj={id:id||'g'+Date.now(),title,cat:document.getElementById('gCat').value,status:document.getElementById('gStatus').value,target:document.getElementById('gTarget').value,notes:document.getElementById('gNotes').value};if(id)db.goals=db.goals.map(g=>g.id===id?obj:g);else db.goals.push(obj);save();closeModal();checkAchievements();render()}
function archiveGoal(id){let g=db.goals.find(g=>g.id===id);if(g)g.status='archived';save();render()}
function promoteGoal(id){let g=db.goals.find(g=>g.id===id);if(!g)return;db.projects.push({id:'p'+Date.now(),title:g.title,cat:g.cat,outcome:g.title,status:'active',goalId:id,next:'',notes:'',steps:[],createdAt:new Date().toISOString()});g.status='active';save();go('projects');toast('Project created from goal')}
function projectsPage(){return '<div class="card"><div class="eyebrow">Turn intention into action</div><h2>Projects</h2><p class="muted">Projects hold multiple steps and a clear next physical action.</p><button class="btn primary" onclick="projectModal()">＋ New project</button></div>'+card('💡 Later / ideas parking lot','<div class="field"><input id="ideaInput" placeholder="Capture an idea without committing to it"></div><button class="btn" onclick="addIdea()">Save idea</button>'+(db.parking.length?db.parking.map((x,i)=>'<div class="task"><div style="flex:1">'+esc(x)+'</div><button class="btn quiet" onclick="promoteIdea('+i+')">Project</button><button class="btn quiet" onclick="removeIdea('+i+')">×</button></div>').join(''):'<div class="muted small">A calm place for ideas that can wait.</div>'))+(db.projects.length?db.projects.map(p=>'<section class="card"><div class="row"><h2>'+esc(p.title)+'</h2><span class="pill">'+esc(p.status)+'</span></div><div class="muted small">'+catName(p.cat)+' · '+p.steps.filter(s=>s.done).length+'/'+p.steps.length+' steps</div><div class="progress"><i style="width:'+(p.steps.length?p.steps.filter(s=>s.done).length/p.steps.length*100:0)+'%"></i></div>'+(p.outcome?'<p>'+esc(p.outcome)+'</p>':'')+'<div class="field"><label>Next physical action</label><input value="'+esc(p.next||'')+'" placeholder="The next concrete action…" onchange="updateProject(\''+p.id+'\',\'next\',this.value)"></div><div class="field"><label>Add a step</label><div class="row"><input id="step-'+p.id+'" class="search" placeholder="One actionable step"><button class="btn" onclick="addStep(\''+p.id+'\')">＋</button></div></div>'+p.steps.map((s,i)=>'<div class="task"><input class="check" type="checkbox" '+(s.done?'checked':'')+' onchange="toggleStep(\''+p.id+'\','+i+',this.checked)"><div style="flex:1">'+esc(s.title)+'</div></div>').join('')+'<div class="actions"><button class="btn" onclick="projectModal(\''+p.id+'\')">Edit project</button><button class="btn" onclick="completeProject(\''+p.id+'\')">Mark complete</button></div></section>').join(''):'<div class="empty">No active projects. Promote a master goal or create one when you’re ready.</div>')}
function projectModal(id=''){let p=db.projects.find(x=>x.id===id)||{};openModal('<h2>'+(id?'Edit project':'New project')+'</h2><div class="field"><label>Project name</label><input id="pTitle" value="'+esc(p.title||'')+'"></div><div class="field"><label>Category</label><select id="pCat">'+CATS.map(c=>'<option value="'+c[0]+'" '+((p.cat||'home')===c[0]?'selected':'')+'>'+c[2]+'</option>').join('')+'</select></div><div class="field"><label>Desired outcome</label><textarea id="pOutcome">'+esc(p.outcome||'')+'</textarea></div><div class="field"><label>Deadline (optional)</label><input id="pDeadline" type="date" value="'+esc(p.deadline||'')+'"></div><div class="field"><label>Related master goal</label><select id="pGoal"><option value="">None</option>'+db.goals.map(g=>'<option value="'+g.id+'" '+(p.goalId===g.id?'selected':'')+'>'+esc(g.title)+'</option>').join('')+'</select></div><div class="field"><label>Notes</label><textarea id="pNotes">'+esc(p.notes||'')+'</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProject(\''+id+'\')">Save project</button></div>')}
function saveProject(id){let title=document.getElementById('pTitle').value.trim();if(!title)return toast('Add a project name');let old=db.projects.find(p=>p.id===id)||{};let obj={...old,id:id||'p'+Date.now(),title,cat:document.getElementById('pCat').value,outcome:document.getElementById('pOutcome').value,deadline:document.getElementById('pDeadline').value,goalId:document.getElementById('pGoal').value,notes:document.getElementById('pNotes').value,status:old.status||'active',next:old.next||'',steps:old.steps||[],createdAt:old.createdAt||new Date().toISOString()};if(id)db.projects=db.projects.map(p=>p.id===id?obj:p);else db.projects.push(obj);save();closeModal();render()}
function updateProject(id,k,v){let p=db.projects.find(p=>p.id===id);if(p){p[k]=v;save()}}function addStep(id){let p=db.projects.find(p=>p.id===id),el=document.getElementById('step-'+id),title=el.value.trim();if(p&&title){p.steps.push({title,done:false});save();render()}}function toggleStep(id,i,v){let p=db.projects.find(p=>p.id===id);if(p){p.steps[i].done=v;save();render()}}function completeProject(id){let p=db.projects.find(p=>p.id===id);if(p){p.status='completed';p.completedAt=new Date().toISOString();if(p.goalId){let g=db.goals.find(g=>g.id===p.goalId);if(g)g.status='completed'}reward('project:'+id,p.title,p.cat,100);checkAchievements();save();render();toast('Project completed 🏆')}}function addIdea(){let e=document.getElementById('ideaInput'),v=e.value.trim();if(v){db.parking.push(v);save();render()}}function removeIdea(i){db.parking.splice(i,1);save();render()}function promoteIdea(i){let title=db.parking.splice(i,1)[0];db.projects.push({id:'p'+Date.now(),title,cat:'learning',status:'active',outcome:title,next:'',steps:[],notes:''});save();render()}
function progressPage(){let inf=levelInfo(db.xp),act=db.activity.slice().reverse();return '<div class="card"><div class="eyebrow">Progress, not perfection</div><h2>Level '+inf.level+' · '+db.xp+' total XP</h2><div class="progress"><i style="width:'+(inf.into/inf.need*100)+'%"></i></div><div class="muted small">'+inf.into+' / '+inf.need+' XP to level '+(inf.level+1)+'</div><div class="grid" style="margin-top:14px"><div class="stat"><span class="muted small">Coins</span><strong>🪙 '+db.coins+'</strong></div><div class="stat"><span class="muted small">Saved reviews</span><strong>'+Object.keys(db.reviews).length+'</strong></div><div class="stat"><span class="muted small">Projects finished</span><strong>'+db.projects.filter(p=>p.status==='completed').length+'</strong></div></div></div>'+card('Category progress',CATS.map(c=>{let x=db.catXP[c[0]]||0,i=levelInfo(x);return '<div class="goal"><div class="row"><b>'+c[1]+' '+c[2]+'</b><span class="pill">LVL '+i.level+'</span></div><div class="progress"><i style="width:'+(i.into/i.need*100)+'%"></i></div><div class="muted small">'+x+' XP total · '+i.into+'/'+i.need+' to next level</div></div>'}).join(''))+card('🏅 Achievements','<div class="grid">'+[['first','🌱','First step'],['weekreview','📝','First weekly review'],['reflections10','📚','Ten reviews'],['goal','🧭','Goal completed'],['project','🏆','Project finished']].map(([id,ic,n])=>'<div class="stat"><div style="font-size:24px">'+ic+'</div><b>'+n+'</b><div class="muted small">'+(db.achievements.includes(id)?'Unlocked':'Not yet unlocked')+'</div></div>').join('')+'</div>')+card('Recent activity',act.length?act.slice(0,20).map(a=>'<div class="task"><div style="flex:1"><b>'+esc(a.title)+'</b><small>'+fmt(a.date,{day:'numeric',month:'short',year:'numeric'})+' · '+catName(a.cat)+'</small></div><span class="pill">+'+a.xp+' XP</span></div>').join(''):'<div class="empty">Your progress appears here as you complete habits and tasks.</div>')+card('Your data & backup','<p class="muted small">This version stores data in this browser on this device. It is not cloud-synced. Export a backup regularly, especially before switching devices or clearing browser data.</p><div class="actions"><button class="btn primary" onclick="exportData()">⬇ Export backup</button><button class="btn" onclick="document.getElementById(\'importFile\').click()">⬆ Import backup</button><input class="hidden" type="file" id="importFile" accept="application/json" onchange="importData(this.files[0])"></div><div class="field"><label><input type="checkbox" '+(db.settings.gamification?'checked':'')+' onchange="db.settings.gamification=this.checked;save();render()"> Show game rewards (XP & coins)</label></div>')}
function openModal(html){document.getElementById('modalRoot').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">'+html+'</div></div>'}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function exportData(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='life-reset-backup-'+dateKey()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')}
function importData(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!x||typeof x!=='object'||!x.habits||!x.reviews)throw Error();if(!confirm('Import this backup and replace the data currently saved in this browser? Export your current data first if you need it.'))return;db=Object.assign(blank(),x);save();render();toast('Backup restored')}catch(e){alert('This backup file could not be read. Your current data has not been changed.')}};reader.readAsText(file)}
function installSeedGoals(){if(db.goals.length)return;let goals=[['faith','Follow Scripture and live by Jesus’ teachings'],['faith','Build a regular prayer life and find a church'],['health','Build strength and muscle sustainably'],['health','Move away from regular weed and nicotine use'],['cooking','Build an affordable collection of nutritious meals'],['cooking','Develop culinary skills and a cooking portfolio'],['learning','Study history, geography and read regularly'],['learning','Organize notes and practise focus'],['career','Prepare for restaurant work and explore private cheffing'],['money','Build savings and plan a future move to Sweden'],['relationships','Keep in touch with family and close friends'],['home','Organize my room and personal administration'],['enjoyment','Explore Barcelona, spend time outdoors and enjoy hobbies']];db.goals=goals.map(([cat,title],i)=>({id:'seedgoal'+i,cat,title,status:'someday',target:'',notes:'',seed:true}));save()}
function migrateLegacyHistory(){if(!db.legacyImported&&db.legacyHistory?.length){db.legacyImported=true;db.legacyHistory.forEach((h,i)=>{if(!h||!h.name)return;let date=h.date||h.day||dateKey();db.activity.push({key:'legacy:'+i,title:h.name,cat:(h.cats&&h.cats[0])||'learning',xp:h.xp||0,date,legacy:true})});save()}}
installSeedGoals();migrateLegacyHistory();render();
</script></body></html>
