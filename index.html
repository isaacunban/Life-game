<body><div id="app" class="app"></div><div id="toast" class="toast"></div><div id="overlay" class="overlay"><div class="pop" id="pop"></div></div>

<script>
const C={mind:["🧠","Mind"],body:["💪","Body"],spiritual:["✝️","Spiritual"],knowledge:["📚","Knowledge"],career:["👨‍🍳","Career"],financial:["💰","Financial"],life:["🧹","Life / Organization"],social:["🤝","Social & Relationships"],growth:["🌱","Personal Growth & Experiences"]};

["Bible reading — 20 min","uncommon",["spiritual","knowledge"],[0,1,2,3,4,5,6]],["Prayer & reflection — 10 min","common",["spiritual","mind"],[0,1,2,3,4,5,6]],
["Meditation / breathing — 10 min","common",["mind","spiritual"],[0,1,2,3,4,5,6]],["Mobility flow — 10 min","common",["body","life"],[0,1,2,3,4,5,6]],["Full-body stretching — 15 min","common",["body"],[0,1,2,3,4,5,6]],
["Strength workout","rare",["body"],[0,2,4]],["Run — 20–30 min","uncommon",["body","mind"],[1,3,5]],["Jog — 20 min","uncommon",["body","mind"],[0,2,4,6]],["Walk — 30 min","common",["body","mind"],[0,1,2,3,4,5,6]],["Boxing session","rare",["body","mind"],[1,4]],
["Math mental arithmetic — 10 min","uncommon",["mind","knowledge"],[0,2,4]],["Sudoku — 15 min","uncommon",["mind"],[1,3,5]],["Memory card training — 15 min","uncommon",["mind"],[0,3,6]],["Number-memory recall — 10 min","uncommon",["mind"],[1,4]],["Pattern recognition puzzles — 15 min","rare",["mind","knowledge"],[2,5]],
["Logic grid puzzle — 20 min","uncommon",["mind","knowledge"],[0,3]],["Mental rotation / spatial puzzles — 15 min","rare",["mind"],[1,5]],["Reaction-time training — 10 min","common",["mind","body"],[2,6]],["Word recall training — 10 min","common",["mind","knowledge"],[0,4]],["Focus session — 25 min","uncommon",["mind","life"],[1,2,4]],
["Read nonfiction — 30 min","uncommon",["knowledge","mind"],[0,2,4,6]],["Study history — 30 min","uncommon",["knowledge"],[1,3,5]],["Learn a language — 20 min","uncommon",["knowledge","career"],[0,1,3,5]],["Science study — 30 min","rare",["knowledge","mind"],[2,4]],["Geography practice — 15 min","common",["knowledge"],[1,5]],
["Write 5 things learned today","common",["knowledge","growth"],[0,1,2,3,4,5,6]],["Gastronomy study — 30 min","rare",["knowledge","career"],[0,2,4]],["Learn one ingredient deeply","uncommon",["career","knowledge"],[1,5]],["Study one cooking technique","rare",["career","knowledge"],[2,4]],["Knife-skills practice","rare",["career","body"],[1,3]],["Menu/food pairing study","epic",["career","knowledge"],[5]],
["Record today's spending","common",["financial","life"],[0,1,2,3,4,5,6]],["Review weekly spending — 15 min","uncommon",["financial"],[6]],["Set aside savings","uncommon",["financial","life"],[4]],["Clean one area — 15 min","common",["life"],[0,1,2,3,4,5,6]],["Plan tomorrow — 10 min","common",["life","mind"],[0,1,2,3,4,5,6]],
["Call someone you care about","uncommon",["social"],[2,6]],["Meet a friend","uncommon",["social"],[5,6]],["Meet someone new","rare",["social","growth"],[4,5]],["Do something kind for someone","uncommon",["social","growth"],[0,2,6]],
["Visit somewhere new","rare",["growth"],[5,6]],["Try something completely new","rare",["growth","mind"],[5]],["Journal — 10 min","common",["growth","mind"],[0,2,4]],["Set one personal goal","uncommon",["growth","life"],[0]],["Do one thing you've been avoiding","rare",["growth","life"],[3]]];
const seeds=taskSeeds.map((x,i)=>({id:"s"+i,name:x[0],diff:x[1],cats:x[2],days:x[3]}));
const ach=[
["🥇","First Step","Complete 1 task",s=>s.total>=1],["🔥","Seven Days","Reach a 7-day streak",s=>s.bestStreak>=7],["⚔️","Getting Serious","Complete 25 tasks",s=>s.total>=25],["💎","1,000 XP","Earn 1,000 XP",s=>s.xp>=1000],
["🤝","Social Spark","Complete 5 social tasks",s=>catDone("social")>=5],["🗺️","Explorer","Complete 5 experience tasks",s=>catDone("growth")>=5],
["🧠","Mind Builder","Complete 25 Mind tasks",s=>catDone("mind")>=25],["📚","Scholar","Complete 50 Knowledge tasks",s=>catDone("knowledge")>=50],["🏋️","Forged","Complete 50 Body tasks",s=>catDone("body")>=50],
["✝️","Steadfast","Complete 50 Spiritual tasks",s=>catDone("spiritual")>=50]];
const trophies=[["🏆","Iron","Reach category level 5"],["🥉","Bronze","Reach category level 15"],["🥈","Silver","Reach category level 30"],["🥇","Gold","Reach category level 50"],["💚","Emerald","Reach category level 75"],["💎","Diamond","Reach category level 100"]];
let state=JSON.parse(localStorage.getItem("lifegame_v11")||localStorage.getItem("lifegame_v09")||"null")||{xp:0,coins:0,streak:0,bestStreak:0,lastDay:null,total:0,history:[],completions:{},tasks:seeds,cat:{},inventory:[],weeklyXP:0,plans:[],skillXP:{},questClaimed:{},missionClaimed:{},activeTitle:"Beginner"};
state.tasks=(state.tasks||[]).map((t,i)=>({id:t.id||"m"+i,name:t.name||"Life task",diff:t.diff&&D[t.diff]?t.diff:"common",cats:Array.isArray(t.cats)&&t.cats.length?t.cats:["life"],days:Array.isArray(t.days)&&t.days.length?t.days:[0,1,2,3,4,5,6]}));
state.completions=state.completions||{};
state.history=Array.isArray(state.history)?state.history:[];
state.cat=state.cat&&typeof state.cat==="object"?state.cat:{};
state.plans=Array.isArray(state.plans)?state.plans:[];state.skillXP=state.skillXP&&typeof state.skillXP==="object"?state.skillXP:{};state.questClaimed=state.questClaimed||{};state.missionClaimed=state.missionClaimed||{};state.activeTitle=state.activeTitle||"Beginner";
Object.keys(C).forEach(k=>state.cat[k]=Number(state.cat[k])||0);
function save(){state.schema=11;localStorage.setItem("lifegame_v11",JSON.stringify(state))}
function key(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function level(x){let l=0;while(x>=xpFor(l+1))l++;return l}
function xpFor(l){return l===0?0:Math.round(50*Math.pow(l,1.45))}
function info(x){let l=level(x),base=xpFor(l),next=xpFor(l+1);return {l,base,next,cur:x-base}}
function catDone(k){return state.history.filter(h=>h.cats.includes(k)).length}
function diffInfo(d){return D[d]||D.common}
function todayTasks(){
 const di=barcelonaDayIndex(); const base=state.tasks.filter(t=>t.days.includes(di));
 const planIds=state.plans.filter(p=>p.days.includes(di)).flatMap(p=>p.tasks);
 const ids=new Set(base.map(t=>t.id));
 planIds.forEach(id=>ids.add(id));
 return state.tasks.filter(t=>ids.has(t.id));
}
function done(t){return !!state.completions[key()+"|"+t.id]}
function tags(cs){return cs.map(c=>'<span class="tag" title="'+C[c][1]+'">'+C[c][0]+'</span>').join("")}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function sound(type="task"){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=type==="level"?660:type==="achievement"?880:520;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.08,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.35);o.start();o.stop(a.currentTime+.36)}catch(e){}}
function dateLabel(){return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"numeric",year:"numeric"}).format(new Date())}
function taskHTML(t){
 let d=done(t),r=diffInfo(t),rar=t.diff||"common",letter={common:"C",uncommon:"U",rare:"R",epic:"E",legendary:"L"}[rar];
 return '<div id="task-'+t.id+'" class="task pressable '+(d?"done":"")+' rarity-'+rar+'" onclick="complete(\\''+t.id+'\\')">'+
 '<div class="task-badge">'+letter+'</div><div class="task-main"><div class="task-name">'+esc(t.name)+'</div><div class="task-sub"><span class="task-tags">'+tags(t.cats)+'</span><span class="rarity-label">'+r[2]+'</span><span class="reward">+'+r[0]+' XP · +'+r[1]+' 🪙</span></div></div></div>';
}
function showUndo(id,rec){
 window.undoRecord={id:id,record:rec};clearTimeout(window.undoTimer);
 const el=document.getElementById("undoToast");if(!el)return;el.classList.add("show");
 window.undoTimer=setTimeout(()=>{el.classList.remove("show");window.undoRecord=null},4200);
}
function burst(type){
 const fx=document.getElementById("fx");if(!fx)return;const count=type==="level"?30:18;
 for(let i=0;i<count;i++){const p=document.createElement("span");p.className="particle";p.textContent=type==="level"?"✦":"•";p.style.setProperty("--x",(Math.random()*100)+"vw");p.style.setProperty("--y",(Math.random()*35+25)+"vh");p.style.setProperty("--dx",((Math.random()-.5)*180)+"px");p.style.setProperty("--dy",((Math.random()-.5)*180)+"px");p.style.animationDelay=(Math.random()*.12)+"s";fx.appendChild(p);setTimeout(()=>p.remove(),900)}
}
function nav(active){
 return '<nav class="bottom"><button class="nav '+(active==="today"?"active":"")+'" onclick="render(\'today\')"><span>☀️</span><small>Today</small></button><button class="nav '+(active==="schedule"?"active":"")+'" onclick="render(\'schedule\')"><span>📅</span><small>Schedule</small></button><button class="nav '+(active==="progress"?"active":"")+'" onclick="render(\'progress\')"><span>🏆</span><small>Progress</small></button><button class="nav '+(active==="profile"?"active":"")+'" onclick="render(\'profile\')"><span>👤</span><small>Profile</small></button></nav>';

function todayHome(){
 const all=todayTasks(),open=all.filter(t=>!done(t)),completed=all.length-open.length,pct=all.length?completed/all.length*100:0;
 let html='<div class="today-top"><div class="eyebrow">TODAY</div><div class="today-date">'+dateLabel()+'</div><div class="today-sub">'+new Intl.DateTimeFormat("en-US",{weekday:"long"}).format(new Date())+'</div><div class="today-progress"><div class="row"><b>'+completed+' of '+all.length+' complete</b><span class="pill">'+state.xp+' XP</span></div><div class="progress-track"><i style="width:'+pct+'%"></i></div></div></div>';
 if(!open.length)html+='<div class="empty-today"><div class="empty-hero">🎉</div><h2>Day complete</h2><p>Everything scheduled for today is done.</p><button class="primary" onclick="openPlanBuilder()">Plan another routine</button></div>';

 html+='<button class="fab" onclick="openModal()">＋</button>'+nav("today");document.getElementById("app").innerHTML=html;
}

 const plans=state.plans||[];let html='<div class="top"><div class="eyebrow">YOUR ROUTINE</div><h1>📅 Schedule</h1><div class="sub">Build your days once. Life Game puts them on Today automatically.</div></div><div class="schedule-hero"><div><b>Weekly planner</b><div class="meta">Uses your phone’s local time.</div></div><button class="primary" onclick="openPlanBuilder()">＋ New</button></div>';

 else html+='<div class="empty-state card"><div class="empty-icon">🗓️</div><b>No routines yet</b><p>Build your first weekly routine and it will feed your Today page.</p><button class="primary" onclick="openPlanBuilder()">Create routine</button></div>';

 try{if(view==="today")todayHome();else if(view==="schedule")scheduleHome();else if(view==="progress")document.getElementById("app").innerHTML=progressHome()+nav("progress");else if(view==="profile")profileHome();else todayHome();window.scrollTo({top:0,behavior:"smooth"})}

function questCheck(x){
 const h=state.history;
 if(x==="Complete 3 tasks")return state.total>=3;
 if(x==="Touch 2 categories")return new Set(h.slice(-10).flatMap(a=>a.cats)).size>=2;
 if(x==="Record today's spending")return h.some(a=>a.name.startsWith("Record today's spending")&&a.date.slice(0,10)===new Date().toISOString().slice(0,10));
 if(x==="Complete 2 Mind tasks")return catDone("mind")>=2;
 if(x==="Complete 1 Knowledge task")return catDone("knowledge")>=1;
 if(x==="Do one Focus session")return h.some(a=>a.name.toLowerCase().includes("focus"));
 if(x==="Complete a strength workout")return h.some(a=>a.name.toLowerCase().includes("strength"));
 if(x==="Complete mobility")return h.some(a=>a.name.toLowerCase().includes("mobility"));

function complete(id){
 const t=state.tasks.find(x=>x.id===id);if(!t||done(t))return;

 state.completions[key()+"|"+t.id]=true;state.xp+=r[0];state.coins+=r[1];state.total++;state.history.push(rec);
 t.cats.forEach(c=>{const oldL=level(before[c]);state.cat[c]=before[c]+r[0];const newL=level(state.cat[c]);if(newL>oldL){for(let lv=oldL+1;lv<=newL;lv++){state.coins+=lv;rec.levelCoins+=lv;rec.levelUps.push({c,level:lv})}}});
 skillForTask(t).forEach(([k,n])=>{const sk=skillKey(k,n);state.skillXP[sk]=(state.skillXP[sk]||0)+r[0]});
 const d=key();if(state.lastDay!==d){state.streak=state.lastDay===yesterdayKey()?state.streak+1:1;state.bestStreak=Math.max(state.bestStreak,state.streak);state.lastDay=d}
 claimQuestRewards();claimMissionRewards();save();sound("task");burst("task");
 const el=document.getElementById("task-"+id);if(el)el.classList.add("hide");
 showUndo(id,rec);setTimeout(()=>{if(rec.levelUps.length)levelPop(rec.levelUps);else render("today")},430);
}

 document.body.appendChild(box);window.planSelected=selected;window.planDays=days;window.planEditId=editId;renderPlanBuilder();

function renderPlanBuilder(){
 const selected=window.planSelected;const ranks=["common","uncommon","rare","epic","legendary"];let html="";
 ranks.forEach(r=>{const ts=state.tasks.filter(t=>t.diff===r).sort((a,b)=>a.name.localeCompare(b.name));if(!ts.length)return;html+='<div class="library-group rarity-'+r+'"><div class="library-group-title">'+D[r][2]+'</div>'+ts.map(t=>'<div class="pick-row '+(selected.has(t.id)?"":"")+'" data-name="'+esc(t.name.toLowerCase())+'" data-cats="'+t.cats.join("|")+'"><div class="task-badge rarity-'+r+'" style="width:36px;height:36px;flex-basis:36px">'+({common:"C",uncommon:"U",rare:"R",epic:"E",legendary:"L"}[r])+'</div><div class="pick-info"><b>'+esc(t.name)+'</b><div class="task-sub"><span class="task-tags">'+tags(t.cats)+'</span><span class="rarity-label">'+D[r][2]+'</span><span class="reward">+'+D[r][0]+' XP</span></div></div><button class="'+(selected.has(t.id)?"remove":"")+'" onclick="togglePlanTask(\\''+t.id+'\\')">'+(selected.has(t.id)?"✓":"+")+'</button></div>').join("")+'</div>'});
 document.getElementById("planLibrary").innerHTML=html;const list=document.getElementById("selectedList");list.innerHTML=selected.size?[...selected].map(id=>{const t=state.tasks.find(x=>x.id===id);return t?'<div class="selected-item"><span>'+tags(t.cats)+' '+esc(t.name)+'</span><button class="secondary" onclick="togglePlanTask(\\''+id+'\\')">Remove</button></div>':""}).join(""):'<div class="selected-empty">No tasks selected yet. Choose tasks below.</div>';document.getElementById("selectedCount").textContent=selected.size;

function savePlan(editId){
 const name=(document.getElementById("planName").value||"").trim()||"My routine";if(!window.planDays.size){toast("Choose at least one day");return}if(!window.planSelected.size){toast("Choose at least one task");return}
 const obj={id:editId||"p"+Date.now(),name,tasks:[...window.planSelected],days:[...window.planDays].sort(),repeat:true};
 if(editId){const i=state.plans.findIndex(p=>p.id===editId);if(i>=0)state.plans[i]=obj}else state.plans.push(obj);

function addTask(){
 const name=document.getElementById("taskName").value.trim();if(!name){toast("Give the task a name");return}
 const cats=[...document.getElementById("taskCats").selectedOptions].map(x=>x.value).slice(0,3);if(!cats.length){toast("Choose at least one category");return}
 const ds=[...document.querySelectorAll("#days .day")].map((x,i)=>x.classList.contains("on")?i:-1).filter(i=>i>=0);if(!ds.length){toast("Choose at least one day");return}
 state.tasks.push({id:"t"+Date.now(),name,diff:document.getElementById("taskDiff").value,cats,days:ds});save();closeModal();render("today");toast("Task added");
}
