<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Life Game</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#718096;--line:#e7ebf2;--accent:#4f7cff;--good:#19a974;--gold:#f5b942;--shadow:0 10px 30px #17203312}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:24px 18px 12px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 16px;box-shadow:var(--shadow)}.hero{display:flex;justify-content:space-between;align-items:center}.level{font-size:34px;font-weight:800}.xpbar{height:9px;background:#edf0f6;border-radius:99px;overflow:hidden;margin-top:12px}.xpbar i{display:block;height:100%;background:var(--accent);border-radius:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f9fc;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.section{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 8px}.task{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.check{width:28px;height:28px;border:2px solid #cbd3e1;border-radius:9px;background:white;flex:0 0 auto}.task.done .check{background:var(--good);border-color:var(--good);color:white}.task.done .name{text-decoration:line-through;color:var(--muted)}.name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:4px}.tags{margin-left:auto;display:flex;gap:3px}.tag{font-size:16px}.reward{font-size:12px;color:#8b6b12;background:#fff6d9;border-radius:8px;padding:4px 6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}.cat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;min-height:105px}.cat .emoji{font-size:25px}.cat b{display:block;margin-top:7px}.cat small{color:var(--muted)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav{background:transparent;color:var(--muted);padding:9px;border-radius:14px}.nav.active{background:#edf3ff;color:var(--accent);font-weight:700}.pill{display:inline-block;padding:6px 10px;background:#edf3ff;color:var(--accent);border-radius:99px;font-weight:700;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{background:var(--accent);color:#fff;border-radius:13px;padding:11px 15px;font-weight:700}.secondary{background:#eef2f7;color:var(--ink);border-radius:13px;padding:11px 15px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:#0b122688;display:none;align-items:end;justify-content:center;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:min(760px,100%);border-radius:25px 25px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:7px 0 12px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 16px;border-radius:99px;display:none;z-index:10;font-weight:700}
</style></head>
<body><div id="app" class="app"></div><div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h2>Add task</h2><button class="secondary" onclick="closeModal()">Close</button></div>
<label>Task name</label><input id="taskName" placeholder="e.g. Read 30 minutes">
<label>XP reward</label><select id="taskReward"><option value="20">Common · 20 XP</option><option value="30">Uncommon · 30 XP</option><option value="50">Rare · 50 XP</option><option value="100">Epic · 100 XP</option><option value="250">Legendary · 250 XP</option></select>
<label>Categories (up to 3)</label><select id="taskCats" multiple size="6"></select>
<button class="primary" style="width:100%;margin-top:8px" onclick="addTask()">Create task</button></div></div>
<script>
const CATS={mind:["🧠","Mind"],body:["💪","Body"],spiritual:["✝️","Spiritual"],knowledge:["📚","Knowledge"],career:["👨‍🍳","Career"],financial:["💰","Financial"],life:["🧹","Life / Organization"],social:["🌎","Social & Relationships"],growth:["🌱","Personal Growth & Experiences"]};
const seed=[
["Bible — 20 minutes",20,["spiritual","knowledge"]],["Prayer / reflection — 20 minutes",20,["spiritual","mind"]],["Mobility — 10 minutes",20,["body","life"]],["Stretching — 15 minutes",20,["body"]],["Gym session",50,["body","mind"]],["Running",30,["body","mind"]],["Walking",20,["body","mind"]],["Boxing",50,["body","mind"]],["Read a book — 30 minutes",30,["knowledge","mind"]],["Brain training — 20 minutes",30,["mind","knowledge"]],["Language — 20 minutes",30,["knowledge","career"]],["Record today’s spending",20,["financial","life"]],["Gastronomy study — 30 minutes",50,["knowledge","career"]],["Call someone you care about",20,["social","mind"]],["Meet someone new",30,["social","growth"]],["Try something completely new",50,["growth","mind"]],["Visit somewhere new",30,["growth"]]
].map((x,i)=>({id:"s"+i,name:x[0],xp:x[1],cats:x[2]}));
const achievements=[["First Step","Complete 1 task",s=>s.done.length>=1],["Seven Days","Reach a 7-day streak",s=>s.streak>=7],["Getting Serious","Complete 25 tasks",s=>s.done.length>=25],["1,000 XP","Earn 1,000 XP",s=>s.xp>=1000],["Social Spark","Complete 5 social tasks",s=>countCat(s,"social")>=5],["Explorer","Complete 5 experience tasks",s=>countCat(s,"growth")>=5]];
let state=JSON.parse(localStorage.getItem("lifegame_v05")||"null")||{xp:0,coins:0,streak:0,lastDate:null,done:[],history:[],tasks:seed};
function save(){localStorage.setItem("lifegame_v05",JSON.stringify(state))}
function level(xp=state.xp){let l=1;while(xp>=100*Math.pow(l,1.55))l++;return l}
function nextXP(){return Math.round(100*Math.pow(level(),1.55))}
function countCat(s,c){return s.done.map(id=>state.tasks.find(t=>t.id===id)).filter(t=>t&&t.cats.includes(c)).length}
function league(){return state.xp<1000?"Bronze":state.xp<3000?"Silver":state.xp<7000?"Gold":"Platinum"}
function tags(cats){return cats.map(c=>'<span class="tag" title="'+CATS[c][1]+'">'+CATS[c][0]+'</span>').join("")}
function taskHTML(t){let done=state.done.includes(t.id);return '<div class="task '+(done?"done":"")+'"><button class="check" onclick="toggleTask(\''+t.id+'\')">'+(done?"✓":"")+'</button><div style="flex:1"><div class="name">'+esc(t.name)+'</div><div class="meta">'+tags(t.cats)+' &nbsp; <span class="reward">+'+t.xp+' XP</span></div></div></div>'}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function render(screen="today"){let html="";
if(screen==="today"){html='<div class="top"><div class="row"><div><h1>Life Game 🎮</h1><div class="sub">Real life progress to win.</div></div><span class="pill">'+league()+'</span></div></div><div class="card hero"><div><div class="sub">Overall level</div><div class="level">'+level()+'</div><div class="sub">'+state.xp+' XP / '+nextXP()+' XP</div></div><div style="font-size:45px">🏆</div></div><div class="card stats"><div class="stat"><b>🔥 '+state.streak+'</b><span>streak</span></div><div class="stat"><b>🪙 '+state.coins+'</b><span>coins</span></div><div class="stat"><b>✓ '+state.done.length+'</b><span>tasks</span></div></div><div class="section"><h2>Today</h2><button class="primary" onclick="openModal()">+ Task</button></div><div class="card">'+state.tasks.map(taskHTML).join("")+'</div>';
}else if(screen==="progress"){html='<div class="top"><h1>Progress</h1><div class="sub">Every category levels independently.</div></div><div class="grid">'+Object.entries(CATS).map(([k,v])=>'<div class="cat" onclick="category(\''+k+'\')"><span class="emoji">'+v[0]+'</span><b>'+v[1]+'</b><small>Level '+(1+Math.floor(countCat(state,k)/5))+' · '+countCat(state,k)+' tasks</small></div>').join("")+'</div><div class="section"><h2>Achievements</h2></div><div class="card">'+achievements.map(a=>'<div class="task"><div style="font-size:25px">'+(a[2](state)?"🏆":"🔒")+'</div><div><div class="name">'+a[0]+'</div><div class="meta">'+a[1]+'</div></div></div>').join("")+'</div>';
}else{html='<div class="top"><h1>Profile</h1><div class="sub">Your real-life player profile.</div></div><div class="card"><div class="row"><div><div class="sub">Level</div><div class="level">'+level()+'</div></div><div style="font-size:55px">🧑‍🚀</div></div><div class="xpbar"><i style="width:'+Math.min(100,state.xp/nextXP()*100)+'%"></i></div><div class="meta" style="margin-top:8px">'+state.xp+' XP · '+league()+' league</div></div><div class="card"><div class="row"><b>Activity</b><span class="pill">'+state.history.length+' entries</span></div>'+state.history.slice().reverse().slice(0,10).map(h=>'<div class="task"><div>✓</div><div><div class="name">'+esc(h.name)+'</div><div class="meta">'+new Date(h.date).toLocaleString()+' · +'+h.xp+' XP</div></div></div>').join("")||'<div class="empty">Complete tasks to build your history.</div>'+'</div><div class="card"><div class="row"><b>Account</b><span class="pill">Prototype</span></div><p class="sub">Cloud accounts and cross-device sync come later. This version stores progress locally in this browser.</p></div>'}
document.getElementById("app").innerHTML=html+'<nav class="bottom"><button class="nav '+(screen==="today"?"active":"")+'" onclick="render(\'today\')">🏠<br>Today</button><button class="nav '+(screen==="progress"?"active":"")+'" onclick="render(\'progress\')">📈<br>Progress</button><button class="nav '+(screen==="profile"?"active":"")+'" onclick="render(\'profile\')">👤<br>Profile</button></nav>'}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;let i=state.done.indexOf(id);if(i>=0){state.done.splice(i,1);state.xp=Math.max(0,state.xp-t.xp);state.coins=Math.max(0,state.coins-Math.ceil(t.xp/2));state.history=state.history.filter(h=>h.id!==id)}else{state.done.push(id);state.xp+=t.xp;state.coins+=Math.ceil(t.xp/2);state.history.push({id,name:t.name,xp:t.xp,date:new Date().toISOString()});let d=new Date().toDateString();if(state.lastDate!==d){state.streak++;state.lastDate=d}toast("+"+t.xp+" XP 🎉")}save();render("today")}
function openModal(){document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
function addTask(){let n=document.getElementById("taskName").value.trim();let xp=+document.getElementById("taskReward").value;let cats=[...document.getElementById("taskCats").selectedOptions].map(o=>o.value).slice(0,3);if(!n||!cats.length)return toast("Add a name and category");state.tasks.push({id:"u"+Date.now(),name:n,xp,cats});save();closeModal();render("today");toast("Task created")}
function category(k){let v=CATS[k],ts=state.tasks.filter(t=>t.cats.includes(k));document.getElementById("app").innerHTML='<div class="top"><button class="secondary" onclick="render(\'progress\')">← Back</button><h1 style="margin-top:16px">'+v[0]+' '+v[1]+'</h1><div class="sub">Level '+(1+Math.floor(countCat(state,k)/5))+' · '+countCat(state,k)+' completed tasks</div></div><div class="card">'+ts.map(taskHTML).join("")+'</div><nav class="bottom"><button class="nav" onclick="render(\'today\')">🏠<br>Today</button><button class="nav active" onclick="render(\'progress\')">📈<br>Progress</button><button class="nav" onclick="render(\'profile\')">👤<br>Profile</button></nav>'}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.style.display="block";setTimeout(()=>e.style.display="none",1400)}
document.getElementById("taskCats").innerHTML=Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v[0]+' '+v[1]+'</option>').join("");
render();
</script></body></html>
