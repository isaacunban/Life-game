-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#101829ee;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:4}.nav{background:transparent;color:var(--muted);padding:8px 4px;border-radius:13px}.nav.active{background:#213154;color:#fff;font-weight:800}.primary{background:var(--blue);color:#fff;border-radius:13px;padding:10px 14px;font-weight:800}.secondary{background:#26324a;color:#fff;border-radius:13px;padding:10px 14px;font-weight:750}.pill{display:inline-block;padding:5px 9px;background:#202e49;border-radius:99px;font-size:11px;color:#bcd0ff;font-weight:800}.chips{display:flex;gap:6px;flex-wrap:wrap}.day{padding:7px 9px;border-radius:9px;background:#222d43;color:var(--muted)}.day.on{background:var(--blue);color:#fff}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:end;justify-content:center;z-index:8}.modal.show{display:flex}.sheet{background:#121b2d;width:min(760px,100%);border:1px solid var(--line);border-radius:25px 25px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet input,.sheet select{width:100%;padding:12px;background:#0d1525;color:#fff;border:1px solid var(--line);border-radius:12px;margin:7px 0 12px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#f5f7fb;color:#101827;padding:11px 16px;border-radius:99px;display:none;z-index:20;font-weight:900;box-shadow:0 10px 30px #0006}.overlay{position:fixed;inset:0;background:#060b14dd;display:none;align-items:center;justify-content:center;z-index:10}.overlay.show{display:flex}.pop{width:min(430px,90%);text-align:center;background:linear-gradient(160deg,#1c2944,#111a2c);border:1px solid #46577a;border-radius:28px;padding:28px;animation:pop .45s}.big{font-size:65px}@keyframes pop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}.achievement{display:flex;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.badge{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#33435f,#171f32);border:1px solid #536483}.locked{filter:grayscale(1);opacity:.42}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.tile{cursor:pointer}.tile strong{display:block;margin-bottom:4px}.small{font-size:12px}.rank{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}

/* v0.8 visual system */
.rarity-common{--rarity:#a8b0bd}.rarity-uncommon{--rarity:#45d483}.rarity-rare{--rarity:#58a6ff}.rarity-epic{--rarity:#b26cff}.rarity-legendary{--rarity:#ffc857}
.task{position:relative}.task-badge{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--rarity) 14%,#111a2b);border:1.5px solid color-mix(in srgb,var(--rarity) 60%,#33415d);color:var(--rarity);font-weight:950;font-size:15px;box-shadow:0 5px 15px #0003}.rarity-label{color:var(--rarity);font-weight:850}.task-main{min-width:0}.task-name{font-weight:800;line-height:1.2}.task-sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}.task-tags{display:flex;gap:2px}.today-group{margin:10px 16px 14px;overflow:hidden}.today-group-head{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;background:linear-gradient(135deg,#1b2842,#151d2f);border:1px solid var(--line);border-radius:17px 17px 0 0}.today-group-head .left{display:flex;align-items:center;gap:9px}.today-group-body{background:rgba(21,29,47,.92);border:1px solid var(--line);border-top:0;padding:0 14px;border-radius:0 0 17px 17px}.today-group .task:last-child{border-bottom:0}.group-count{font-size:11px;padding:4px 8px;border-radius:99px;background:#202e49;color:#bcd0ff;font-weight:850}.clickable{cursor:pointer}.collapsed .today-group-body{display:none}.schedule-card{margin-bottom:12px}.schedule-card .schedule-head{padding:16px}.schedule-card.open .schedule-head{border-bottom:1px solid var(--line);border-radius:18px 18px 0 0}.schedule-body{padding:0 16px;display:none}.schedule-card.open .schedule-body{display:block}.schedule-arrow{font-size:18px;color:var(--muted);transition:.2s}.schedule-card.open .schedule-arrow{transform:rotate(90deg)}.schedule-task{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}.schedule-task:last-child{border-bottom:0}.rarity-dot{width:10px;height:10px;border-radius:50%;background:var(--rarity);box-shadow:0 0 10px color-mix(in srgb,var(--rarity) 65%,transparent)}.empty-state{text-align:center;padding:30px 15px;color:var(--muted)}.empty-icon{font-size:48px;margin-bottom:8px}.detail-hero{background:linear-gradient(145deg,#1c2944,#111a2c);border:1px solid #354463;border-radius:24px;padding:20px;margin:12px 16px}.achievement-card,.trophy-card{display:flex;gap:14px;align-items:center;padding:15px;background:#151e31;border:1px solid var(--line);border-radius:17px;margin:9px 16px}.achievement-card.unlocked{border-color:#52698f;background:linear-gradient(145deg,#1a2941,#151d2f)}.achievement-card.locked{opacity:.58}.achievement-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,#34435e,#171f32);border:1px solid #526483}.achievement-card.unlocked .achievement-icon{box-shadow:0 0 22px #5b8cff33}.achievement-card .info{flex:1}.progress-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 16px}.tab{background:#151e31;color:var(--muted);border:1px solid var(--line);border-radius:13px;padding:10px 5px;font-weight:800}.tab.active{background:#26385f;color:#fff;border-color:#5b8cff}.filter-row{display:flex;gap:7px;overflow:auto;padding:0 16px 4px}.filter{white-space:nowrap;background:#172137;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-weight:750}.filter.active{background:#2a3d68;color:#fff}.plan-card{margin:10px 16px;background:#151e31;border:1px solid var(--line);border-radius:18px;overflow:hidden}.plan-head{padding:15px;display:flex;justify-content:space-between;align-items:center}.plan-body{padding:0 15px 15px;border-top:1px solid var(--line)}.plan-days{display:flex;gap:5px;flex-wrap:wrap;padding-top:12px}.day-chip{font-size:11px;padding:5px 8px;border-radius:8px;background:#25314a;color:#c5d1e7}.builder-cats{display:flex;flex-direction:column;gap:8px}.builder-cat{background:#172137;border:1px solid var(--line);border-radius:14px;overflow:hidden}.builder-cat-head{padding:12px;display:flex;justify-content:space-between;align-items:center}.builder-cat-body{padding:0 12px 8px;display:none}.builder-cat.open .builder-cat-body{display:block}.add-task-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #293550}.plus-btn{width:32px;height:32px;border-radius:10px;border:1px solid #405174;background:#23314d;color:#fff;font-size:20px}.selected-task{background:#1e3151}.schedule-summary{background:#101a2c;border:1px solid #2d3c59;border-radius:14px;padding:12px;margin-top:12px}.fab{position:fixed;right:18px;bottom:105px;width:56px;height:56px;border-radius:18px;border:1px solid #7d9fff;background:var(--blue);color:#fff;font-size:28px;font-weight:800;box-shadow:0 12px 28px #0006;z-index:5}
</style></head>
<body><div id="app" class="app"></div><div id="toast" class="toast"></div><div id="overlay" class="overlay"><div class="pop" id="pop"></div></div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h2 id="modalTitle">Add task</h2><button class="secondary" onclick="closeModal()">Close</button></div><label>Task</label><input id="taskName" placeholder="e.g. Mental math — 10 min"><label>Difficulty</label><select id="taskDiff"></select><label>Categories (1–3)</label><select id="taskCats" multiple size="7"></select><label>Days</label><div id="days" class="chips"></div><button class="primary" style="width:100%;margin-top:10px" onclick="addTask()">Create task</button></div></div>
<script>
const C={mind:["🧠","Mind"],body:["💪","Body"],spiritual:["✝️","Spiritual"],knowledge:["📚","Knowledge"],career:["👨‍🍳","Career"],financial:["💰","Financial"],life:["🧹","Life / Organization"],social:["🤝","Social & Relationships"],growth:["🌱","Personal Growth & Experiences"]};
const D={common:[20,10,"Common"],uncommon:[30,15,"Uncommon"],rare:[50,25,"Rare"],epic:[100,50,"Epic"],legendary:[250,125,"Legendary"]};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const today=new Date().getDay(); const dayIndex=today===0?6:today-1;
const taskSeeds=[
["Bible reading — 20 min","uncommon",["spiritual","knowledge"],[0,1,2,3,4,5,6]],["Prayer & reflection — 10 min","common",["spiritual","mind"],[0,1,2,3,4,5,6]],
["Meditation / breathing — 10 min","common",["mind","spiritual"],[0,1,2,3,4,5,6]],["Mobility flow — 10 min","common",["body","life"],[0,1,2,3,4,5,6]],["Full-body stretching — 15 min","common",["body"],[0,1,2,3,4,5,6]],
["Strength workout","rare",["body"],[0,2,4]],["Run — 20–30 min","uncommon",["body","mind"],[1,3,5]],["Jog — 20 min","uncommon",["body","mind"],[0,2,4,6]],["Walk — 30 min","common",["body","mind"],[0,1,2,3,4,5,6]],["Boxing session","rare",["body","mind"],[1,4]],
["Math mental arithmetic — 10 min","uncommon",["mind","knowledge"],[0,2,4]],["Sudoku — 15 min","uncommon",["mind"],[1,3,5]],["Memory card training — 15 min","uncommon",["mind"],[0,3,6]],["Number-memory recall — 10 min","uncommon",["mind"],[1,4]],["Pattern recognition puzzles — 15 min","rare",["mind","knowledge"],[2,5]],
["Logic grid puzzle — 20 min","uncommon",["mind","knowledge"],[0,3]],["Mental rotation / spatial puzzles — 15 min","rare",["mind"],[1,5]],["Reaction-time training — 10 min","common",["mind","body"],[2,6]],["Word recall training — 10 min","common",["mind","knowledge"],[0,4]],["Focus session — 25 min","uncommon",["mind","life"],[1,2,4]],
["Read nonfiction — 30 min","uncommon",["knowledge","mind"],[0,2,4,6]],["Study history — 30 min","uncommon",["knowledge"],[1,3,5]],["Learn a language — 20 min","uncommon",["knowledge","career"],[0,1,3,5]],["Science study — 30 min","rare",["knowledge","mind"],[2,4]],["Geography practice — 15 min","common",["knowledge"],[1,5]],
["Write 5 things learned today","common",["knowledge","growth"],[0,1,2,3,4,5,6]],["Gastronomy study — 30 min","rare",["knowledge","career"],[0,2,4]],["Learn one ingredient deeply","uncommon",["career","knowledge"],[1,5]],["Study one cooking technique","rare",["career","knowledge"],[2,4]],["Knife-skills practice","rare",["career","body"],[1,3]],["Menu/food pairing study","epic",["career","knowledge"],[5]],
["Record today's spending","common",["financial","life"],[0,1,2,3,4,5,6]],["Review weekly spending — 15 min","uncommon",["financial"],[6]],["Set aside savings","uncommon",["financial","life"],[4]],["Clean one area — 15 min","common",["life"],[0,1,2,3,4,5,6]],["Plan tomorrow — 10 min","common",["life","mind"],[0,1,2,3,4,5,6]],
["Call someone you care about","uncommon",["social"],[2,6]],["Meet a friend","uncommon",["social"],[5,6]],["Meet someone new","rare",["social","growth"],[4,5]],["Do something kind for someone","uncommon",["social","growth"],[0,2,6]],
["Visit somewhere new","rare",["growth"],[5,6]],["Try something completely new","rare",["growth","mind"],[5]],["Journal — 10 min","common",["growth","mind"],[0,2,4]],["Set one personal goal","uncommon",["growth","life"],[0]],["Do one thing you've been avoiding","rare",["growth","life"],[3]]];
const seeds=taskSeeds.map((x,i)=>({id:"s"+i,name:x[0],diff:x[1],cats:x[2],days:x[3]}));
const ach=[
["🥇","First Step","Complete 1 task",s=>s.total>=1],["🔥","Seven Days","Reach a 7-day streak",s=>s.bestStreak>=7],["⚔️","Getting Serious","Complete 25 tasks",s=>s.total>=25],["💎","1,000 XP","Earn 1,000 XP",s=>s.xp>=1000],
["🤝","Social Spark","Complete 5 social tasks",s=>catDone("social")>=5],["🗺️","Explorer","Complete 5 experience tasks",s=>catDone("growth")>=5],
["🧠","Mind Builder","Complete 25 Mind tasks",s=>catDone("mind")>=25],["📚","Scholar","Complete 50 Knowledge tasks",s=>catDone("knowledge")>=50],["🏋️","Forged","Complete 50 Body tasks",s=>catDone("body")>=50],
["✝️","Steadfast","Complete 50 Spiritual tasks",s=>catDone("spiritual")>=50]];
const trophies=[["🏆","Iron","Reach category level 5"],["🥉","Bronze","Reach category level 15"],["🥈","Silver","Reach category level 30"],["🥇","Gold","Reach category level 50"],["💚","Emerald","Reach category level 75"],["💎","Diamond","Reach category level 100"]];
let state=JSON.parse(localStorage.getItem("lifegame_v07")||"null")||{xp:0,coins:0,streak:0,bestStreak:0,lastDay:null,total:0,history:[],completions:{},tasks:seeds,cat:{},inventory:[],weeklyXP:0};
state.tasks=(state.tasks||[]).map((t,i)=>({id:t.id||"m"+i,name:t.name||"Life task",diff:t.diff&&D[t.diff]?t.diff:"common",cats:Array.isArray(t.cats)&&t.cats.length?t.cats:["life"],days:Array.isArray(t.days)&&t.days.length?t.days:[0,1,2,3,4,5,6]}));
state.completions=state.completions||{};
state.history=Array.isArray(state.history)?state.history:[];
state.cat=state.cat&&typeof state.cat==="object"?state.cat:{};
state.plans=Array.isArray(state.plans)?state.plans:[];
Object.keys(C).forEach(k=>state.cat[k]=Number(state.cat[k])||0);
function save(){localStorage.setItem("lifegame_v07",JSON.stringify(state))}
function key(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function level(x){let l=0;while(x>=xpFor(l+1))l++;return l}
function xpFor(l){return l===0?0:Math.round(50*Math.pow(l,1.45))}
function info(x){let l=level(x),base=xpFor(l),next=xpFor(l+1);return {l,base,next,cur:x-base}}
function catDone(k){return state.history.filter(h=>h.cats.includes(k)).length}
function diffInfo(d){return D[d]||D.common}
function todayTasks(){return state.tasks.filter(t=>t.days.includes(dayIndex))}
function done(t){return !!state.completions[key()+"|"+t.id]}
function tags(cs){return cs.map(c=>'<span class="tag" title="'+C[c][1]+'">'+C[c][0]+'</span>').join("")}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function sound(type="task"){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=type==="level"?660:type==="achievement"?880:520;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.08,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.35);o.start();o.stop(a.currentTime+.36)}catch(e){}}
function dateLabel(){return new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Madrid",day:"numeric",month:"numeric",year:"numeric"}).format(new Date())}
function taskHTML(t){let d=done(t),r=diffInfo(t),rar=t.diff||"common";return '<div id="task-'+t.id+'" class="task '+(d?"done":"")+'"><button class="check '+(d?"done":"")+'" '+(d?"disabled":"")+' onclick="complete(\''+t.id+'\')">'+(d?"✓":"")+'</button><div class="task-badge rarity-'+rar+'">'+({common:"C",uncommon:"U",rare:"R",epic:"E",legendary:"L"}[rar])+'</div><div class="task-main"><div class="task-name">'+esc(t.name)+'</div><div class="task-sub"><span class="task-tags">'+tags(t.cats)+'</span><span class="rarity-label">'+r[2]+'</span><span class="reward">+'+r[0]+' XP · +'+r[1]+' 🪙</span></div></div></div>'}
function nav(s){return '<nav class="bottom"><button class="nav '+(s==="today"?"active":"")+'" onclick="render(\'today\')">☀️<br>Today</button><button class="nav '+(s==="schedule"?"active":"")+'" onclick="render(\'schedule\')">📅<br>Schedule</button><button class="nav '+(s==="progress"?"active":"")+'" onclick="render(\'progress\')">🏆<br>Progress</button><button class="nav '+(s==="profile"?"active":"")+'" onclick="render(\'profile\')">👤<br>Profile</button></nav>'}
function render(s="today"){
 let h="";
 if(s==="today"){
  let ts=todayTasks(), groups=Object.entries(C).map(([k,v])=>[k,v,ts.filter(t=>t.cats.includes(k))]).filter(x=>x[2].length);
  h='<div class="top"><div class="row"><div><h1>☀️ Today</h1><div class="sub">'+dateLabel()+' · Barcelona time</div></div><span class="pill">Level '+level(state.xp)+'</span></div></div>'+
  '<div class="card"><div class="row"><div><div class="sub">Daily progress</div><b style="font-size:25px">'+ts.filter(done).length+' / '+ts.length+'</b></div><div class="big" style="font-size:42px">🔥</div></div><div class="xpbar"><i style="width:'+Math.min(100,(ts.length?ts.filter(done).length/ts.length:0)*100)+'%"></i></div></div>'+
  '<div class="card stats"><div class="stat"><b>⚡ '+state.xp+'</b><span>XP</span></div><div class="stat"><b>🪙 '+state.coins+'</b><span>coins</span></div><div class="stat"><b>🔥 '+state.streak+'</b><span>streak</span></div></div>'+
  '<div class="section"><h2>Today’s tasks</h2><button class="primary" onclick="openModal()">+ Add</button></div>'+
  (groups.length?groups.map(([k,v,gt])=>'<div class="today-group"><div class="today-group-head"><div class="left"><span class="emoji">'+v[0]+'</span><b>'+v[1]+'</b><span class="group-count">'+gt.length+'</span></div><span class="meta">'+gt.filter(done).length+'/'+gt.length+'</span></div><div class="today-group-body">'+gt.map(taskHTML).join("")+'</div></div>').join(""):'<div class="card empty-state"><div class="empty-icon">🌱</div><b>Your day is empty</b><p>Add a task or create a weekly plan in Schedule.</p></div>')+
  '<div class="section"><h2>🎯 Daily missions</h2></div><div class="card"><div class="task"><div class="task-badge rarity-rare">3</div><div><div class="name">Complete 3 tasks</div><div class="meta">'+Math.min(ts.filter(done).length,3)+' / 3 · +30 XP</div></div></div><div class="task"><div class="task-badge rarity-uncommon">2</div><div><div class="name">Touch 2 categories</div><div class="meta">'+new Set(ts.filter(done).flatMap(t=>t.cats)).size+' / 2 · +25 XP</div></div></div></div>';
 } else if(s==="schedule"){
  h='<div class="top"><div class="row"><div><h1>📅 Schedule</h1><div class="sub">Build your own days and weekly routines.</div></div></div></div>'+
  '<div class="section"><h2>My weekly plans</h2></div>'+
  (state.plans.length?state.plans.map(p=>'<div class="plan-card"><div class="plan-head"><div><b>📋 '+esc(p.name)+'</b><div class="meta">'+p.tasks.length+' tasks · '+(p.repeat?"Repeats weekly":"One-time")+'</div></div><button class="secondary" onclick="deletePlan(\''+p.id+'\')">×</button></div><div class="plan-body"><div class="plan-days">'+p.days.map(d=>'<span class="day-chip">'+DAYS[d]+'</span>').join("")+'</div><div class="meta" style="margin-top:9px">'+p.tasks.map(id=>{let t=state.tasks.find(x=>x.id===id);return t?esc(t.name):""}).filter(Boolean).join(" · ")+'</div></div></div>').join(""):'<div class="card empty-state"><div class="empty-icon">📅</div><b>No weekly plans yet</b><p>Create your own “Monday Productive”, “Monday Working”, gym day, study day, or complete weekly routine.</p></div>')+
  '<button class="fab" onclick="openPlanBuilder()">+</button>'+
  '<div class="section"><h2>Task library</h2></div>'+
  Object.entries(C).map(([k,v])=>'<div class="card schedule-card" id="sc-'+k+'"><div class="schedule-head clickable row" onclick="toggleSection(\''+k+'\')"><div><span class="emoji">'+v[0]+'</span> <b>'+v[1]+'</b><div class="meta" style="margin-left:38px">'+state.tasks.filter(t=>t.cats.includes(k)).length+' tasks</div></div><span class="schedule-arrow">›</span></div><div class="schedule-body">'+state.tasks.filter(t=>t.cats.includes(k)).map(t=>{let r=diffInfo(t.diff),rar=t.diff;return '<div class="schedule-task"><div class="task-badge rarity-'+rar+'" style="width:38px;height:38px;flex-basis:38px">'+({common:"C",uncommon:"U",rare:"R",epic:"E",legendary:"L"}[rar])+'</div><div style="flex:1"><div class="task-name">'+esc(t.name)+'</div><div class="task-sub"><span class="rarity-label">'+r[2]+'</span><span class="reward">+'+r[0]+' XP</span></div></div></div>'}).join("")+'</div></div>').join("");
 } else if(s==="progress"){h=progressHome()}
 else if(s==="profile"){h=profileHome()}
 document.getElementById("app").innerHTML=h+nav(s);
}
function progressHome(){
 let unlocked=ach.filter(a=>a[3](state)).length;
 return '<div class="top"><h1>🏆 Progress</h1><div class="sub">Your life, broken into skills you can actually see grow.</div></div>'+
 '<div class="detail-hero"><div class="row"><div><div class="sub">Overall level</div><div class="level">Lv '+level(state.xp)+'</div><div class="meta">'+info(state.xp).cur+' / '+(info(state.xp).next-info(state.xp).base)+' XP</div></div><div class="big">🌟</div></div><div class="xpbar"><i style="width:'+Math.min(100,info(state.xp).cur/(info(state.xp).next-info(state.xp).base)*100)+'%"></i></div></div>'+
 '<div class="progress-tabs"><button class="tab active" onclick="progressTab(\'skills\')">📊 Skills</button><button class="tab" onclick="progressTab(\'achievements\')">🏅 Achievements</button><button class="tab" onclick="progressTab(\'trophies\')">🏆 Trophies</button></div>'+
 '<div id="progressContent">'+skillsContent()+'</div>';
}
function skillsContent(){return '<div class="section"><h2>Life categories</h2><span class="pill">'+Object.keys(C).length+' skills</span></div><div class="grid">'+Object.entries(C).map(([k,v])=>{let inf=info(state.cat[k]);return '<div class="cat" onclick="category(\''+k+'\')"><span class="emoji">'+v[0]+'</span><b>'+v[1]+'</b><small>Level '+inf.l+' · '+inf.cur+'/'+(inf.next-inf.base)+' XP</small><div class="bar"><i style="width:'+Math.min(100,inf.cur/(inf.next-inf.base)*100)+'%"></i></div></div>'}).join("")+'</div>'}
function progressTab(tab){
 let el=document.getElementById("progressContent"); if(!el)return;
 if(tab==="skills")el.innerHTML=skillsContent();
 if(tab==="achievements")el.innerHTML=achievementPage();
 if(tab==="trophies")el.innerHTML=trophyPage();
 document.querySelectorAll(".tab").forEach((x,i)=>x.classList.toggle("active",(tab==="skills"&&i===0)||(tab==="achievements"&&i===1)||(tab==="trophies"&&i===2)));
}
function achievementPage(){
 let unlocked=ach.filter(a=>a[3](state)),locked=ach.filter(a=>!a[3](state));
 return '<div class="filter-row"><span class="filter active">All '+ach.length+'</span><span class="filter">Unlocked '+unlocked.length+'</span><span class="filter">In progress '+locked.length+'</span></div>'+
 '<div class="section"><h2>Unlocked</h2><span class="pill">'+unlocked.length+'</span></div>'+
 (unlocked.length?unlocked.map(a=>achievementCard(a,false)).join(""):'<div class="card empty-state">No achievements unlocked yet. Your first one is waiting. 🎯</div>')+
 '<div class="section"><h2>🔒 Still to unlock</h2><span class="pill">'+locked.length+'</span></div>'+
 locked.map(a=>achievementCard(a,true)).join("");
}
function achievementCard(a,locked){let progress=achievementProgress(a);return '<div class="achievement-card '+(locked?"locked":"unlocked")+'"><div class="achievement-icon">'+a[0]+'</div><div class="info"><div class="row"><b>'+a[1]+'</b><span class="pill">'+(locked?"LOCKED":"✓")+'</span></div><div class="meta">'+a[2]+'</div>'+(progress?'<div class="bar"><i style="width:'+progress.p+'%"></i></div><div class="small">'+progress.text+'</div>':"")+'</div></div>'}
function achievementProgress(a){let n=a[1],v=0,max=1,text="";if(n==="First Step"){v=state.total;max=1} else if(n==="Getting Serious"){v=state.total;max=25} else if(n==="1,000 XP"){v=state.xp;max=1000} else if(n==="Seven Days"){v=state.bestStreak;max=7} else if(n==="Social Spark"){v=catDone("social");max=5} else if(n==="Explorer"){v=catDone("growth");max=5} else if(n==="Mind Builder"){v=catDone("mind");max=25} else if(n==="Scholar"){v=catDone("knowledge");max=50} else if(n==="Forged"){v=catDone("body");max=50} else if(n==="Steadfast"){v=catDone("spiritual");max=50} else return null;return {p:Math.min(100,v/max*100),text:Math.min(v,max)+" / "+max}}
function trophyPage(){return '<div class="section"><h2>Category trophy ladder</h2></div><div class="card"><p class="meta">Every category can earn the same six mastery ranks. Your highest rank is based on that category’s level.</p></div>'+Object.entries(C).map(([k,v])=>{let l=level(state.cat[k]);let rank=l>=100?5:l>=75?4:l>=50?3:l>=30?2:l>=15?1:l>=5?0:-1;return '<div class="trophy-card"><div class="achievement-icon">'+(rank>=0?trophies[rank][0]:"🔒")+'</div><div class="info"><b>'+v[0]+' '+v[1]+'</b><div class="meta">Level '+l+' · '+(rank>=0?trophies[rank][1]:"Next: Iron at Lv 5")+'</div><div class="bar"><i style="width:'+Math.min(100,l/100*100)+'%"></i></div></div></div>'}).join("")}
function profileHome(){let inf=info(state.xp),u=ach.filter(a=>a[3](state)).length;return '<div class="top"><h1>👤 Character</h1><div class="sub">Your Life Game home base.</div></div><div class="detail-hero"><div class="hero"><div><div class="sub">ISAAC</div><div class="level">Lv '+inf.l+'</div><div class="sub">'+inf.cur+' / '+(inf.next-inf.base)+' XP</div></div><div class="big">🧑‍🚀</div></div><div class="xpbar"><i style="width:'+Math.min(100,inf.cur/(inf.next-inf.base)*100)+'%"></i></div><div class="stats" style="margin-top:12px"><div class="stat"><b>🔥 '+state.streak+'</b><span>streak</span></div><div class="stat"><b>🪙 '+state.coins+'</b><span>coins</span></div><div class="stat"><b>✓ '+state.total+'</b><span>tasks</span></div></div></div>'+
 '<div class="card menu"><div class="tile" onclick="progressTabFromProfile(\'achievements\')"><strong>🏅 Achievements</strong><span class="meta">'+u+'/'+ach.length+' unlocked · view all</span></div><div class="tile" onclick="progressTabFromProfile(\'trophies\')"><strong>🏆 Trophies</strong><span class="meta">Category mastery cabinet</span></div><div class="tile" onclick="historyPage()"><strong>📜 History</strong><span class="meta">'+state.history.length+' activities</span></div><div class="tile" onclick="shop()"><strong>🛒 Shop</strong><span class="meta">'+state.coins+' 🪙 to spend</span></div><div class="tile" onclick="leaguePage()"><strong>🥇 League</strong><span class="meta">Weekly XP ranking</span></div><div class="tile" onclick="render(\'progress\')"><strong>📊 Life Stats</strong><span class="meta">Every category & skill</span></div></div>'+
 '<div class="section"><h2>Recent activity</h2></div><div class="card">'+(state.history.length?state.history.slice(-4).reverse().map(h=>'<div class="task"><div class="task-badge rarity-uncommon">✓</div><div><div class="name">'+esc(h.name)+'</div><div class="meta">+'+h.xp+' XP · '+h.cats.map(c=>C[c][1]).join(" · ")+'</div></div></div>').join(""):'<div class="empty-state">Complete your first task to start your story.</div>')+'</div>'}
function progressTabFromProfile(tab){render("progress");setTimeout(()=>progressTab(tab),0)}
function toggleSection(k){let e=document.getElementById("sc-"+k);if(e)e.classList.toggle("open")}
function openPlanBuilder(){
 document.getElementById("modalTitle").textContent="Create a day / weekly plan";
 document.querySelector("#modal .sheet").innerHTML='<div class="row"><h2>📅 Build a plan</h2><button class="secondary" onclick="closeModal()">Close</button></div><label>Plan name</label><input id="planName" placeholder="e.g. Monday Productive"><label>Choose days</label><div id="planDays" class="chips">'+DAYS.map((d,i)=>'<button type="button" class="day" data-i="'+i+'" onclick="this.classList.toggle(\'on\')">'+d+'</button>').join("")+'</div><div class="schedule-summary"><b>Repeat every week</b><div class="meta">Turn this on to automatically place the plan on these days each week.</div><label style="display:flex;align-items:center;gap:8px;margin-top:9px"><input id="planRepeat" type="checkbox" checked style="width:auto;margin:0"> Repeat weekly</label></div><label style="margin-top:12px;display:block">Choose tasks</label><div class="builder-cats">'+Object.entries(C).map(([k,v])=>'<div class="builder-cat"><div class="builder-cat-head" onclick="this.parentElement.classList.toggle(\'open\')"><b>'+v[0]+' '+v[1]+'</b><span>›</span></div><div class="builder-cat-body">'+state.tasks.filter(t=>t.cats.includes(k)).map(t=>'<div class="add-task-row"><span><b>'+esc(t.name)+'</b><br><span class="meta">'+diffInfo(t.diff)[2]+' · +'+diffInfo(t.diff)[0]+' XP</span></span><button class="plus-btn" id="pb-'+t.id+'" onclick="togglePlanTask(\''+t.id+'\',this)">+</button></div>').join("")+'</div></div>').join("")+'</div><button class="primary" style="width:100%;margin-top:14px" onclick="savePlan()">Save plan</button>';
 openModal();
}
function togglePlanTask(id,btn){btn.classList.toggle("selected-task");btn.textContent=btn.classList.contains("selected-task")?"✓":"+"}
function savePlan(){let name=document.getElementById("planName").value.trim(),days=[...document.querySelectorAll("#planDays .day.on")].map(e=>+e.dataset.i),tasks=[...document.querySelectorAll(".plus-btn.selected-task")].map(e=>e.id.replace("pb-","")),repeat=document.getElementById("planRepeat").checked;if(!name||!days.length||!tasks.length)return toast("Choose a name, day and at least one task");state.plans.push({id:"p"+Date.now(),name,days,tasks,repeat});save();closeModal();render("schedule");toast("Plan saved 📅")}
function deletePlan(id){state.plans=state.plans.filter(p=>p.id!==id);save();render("schedule");toast("Plan removed")}
function category(k){let v=C[k],ts=state.tasks.filter(t=>t.cats.includes(k)),inf=info(state.cat[k]);document.getElementById("app").innerHTML='<div class="top"><button class="secondary" onclick="render(\'progress\')">← Progress</button><h1 style="margin-top:15px">'+v[0]+' '+v[1]+'</h1><div class="sub">Level '+inf.l+' · '+inf.cur+'/'+(inf.next-inf.base)+' XP · '+catDone(k)+' completed</div></div><div class="card"><div class="xpbar"><i style="width:'+Math.min(100,inf.cur/(inf.next-inf.base)*100)+'%"></i></div></div><div class="section"><h2>Tasks</h2></div><div class="card">'+ts.map(t=>taskHTML(t)).join("")+'</div>'+nav("progress")}
function complete(id){let t=state.tasks.find(x=>x.id===id);if(!t||done(t))return;let r=diffInfo(t.diff),old={};t.cats.forEach(c=>old[c]=info(state.cat[c]).l);state.completions[key()+"|"+id]=true;state.xp+=r[0];state.coins+=r[1];state.total++;state.weeklyXP+=r[0];t.cats.forEach(c=>state.cat[c]+=r[0]);state.history.push({id:t.id,name:t.name,xp:r[0],cats:t.cats,date:new Date().toISOString()});let ld=state.lastDay;if(ld!==key()){state.streak=ld&&new Date(key())-new Date(ld)===86400000?state.streak+1:1;state.bestStreak=Math.max(state.bestStreak,state.streak);state.lastDay=key()}save();sound();const e=document.getElementById("task-"+id);if(e)e.classList.add("hide");setTimeout(()=>{render("today")},330);let ups=t.cats.map(c=>({c,old:old[c],now:info(state.cat[c]).l})).filter(x=>x.now>x.old);if(ups.length)setTimeout(()=>levelPop(ups),400);toast("+"+r[0]+" XP  +" +r[1]+" 🪙")}
function levelPop(ups){sound("level");document.getElementById("pop").innerHTML='<div class="big">⚡</div><h2>LEVEL UP!</h2>'+ups.map(x=>'<p style="font-size:19px">'+C[x.c][0]+' '+C[x.c][1]+' <b>Lv '+x.old+' → '+x.now+'</b><br><span class="meta">+'+Array.from({length:x.now-x.old},(_,i)=>x.old+i+1).reduce((a,b)=>a+b,0)+' 🪙 level rewards</span></p>').join("")+'<button class="primary" onclick="closePop()">Continue</button>';document.getElementById("overlay").classList.add("show")}
function closePop(){document.getElementById("overlay").classList.remove("show")}
function showTrophies(){render("progress");setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),50)}
function historyPage(){document.getElementById("app").innerHTML='<div class="top"><button class="secondary" onclick="render(\'profile\')">← Character</button><h1 style="margin-top:15px">📜 Activity</h1><div class="sub">Everything you have completed.</div></div><div class="card">'+state.history.slice().reverse().map(h=>'<div class="task"><div class="badge">'+tags(h.cats)+'</div><div><div class="name">'+esc(h.name)+'</div><div class="meta">'+new Date(h.date).toLocaleDateString()+' · +'+h.xp+' XP</div></div></div>').join("")+'</div>'+nav("profile")}
function leaguePage(){let names=["You","Friend A","Friend B","Friend C","Friend D"];document.getElementById("app").innerHTML='<div class="top"><button class="secondary" onclick="render(\'profile\')">← Character</button><h1 style="margin-top:15px">🥇 Weekly League</h1><div class="sub">Weekly XP resets; lifetime level stays.</div></div><div class="card">'+names.map((n,i)=>'<div class="rank"><b>'+(["🥇","🥈","🥉","4","5"][i])+' '+n+'</b><span>'+((i===0?state.weeklyXP:Math.max(20,900-i*170)))+' XP</span></div>').join("")+'</div><div class="card"><b>How leagues work</b><p class="meta">Earn XP by completing real-life tasks. Compete with friends later; no buying XP and no pay-to-win.</p></div>'+nav("profile")}
function shop(){document.getElementById("app").innerHTML='<div class="top"><button class="secondary" onclick="render(\'profile\')">← Character</button><h1 style="margin-top:15px">🛒 Life Shop</h1><div class="sub">Spend coins earned from real progress.</div></div><div class="grid">'+[["🎨","Profile theme",500],["✨","Completion effect",750],["🔊","Sound pack",750],["👑","Legendary frame",2500],["🌌","Profile background",1500],["🏷️","Special title",1000]].map(x=>'<div class="tile"><div class="big" style="font-size:35px">'+x[0]+'</div><strong>'+x[1]+'</strong><span class="pill">'+x[2]+' 🪙</span><button class="secondary" style="width:100%;margin-top:9px" onclick="buy('+x[2]+')">Unlock</button></div>').join("")+'</div>'+nav("profile")}
function buy(cost){if(state.coins<cost)return toast("Not enough coins");state.coins-=cost;state.inventory.push(cost);save();sound("achievement");toast("Unlocked! ✨")}
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function addTask(){let n=document.getElementById("taskName").value.trim(),d=document.getElementById("taskDiff").value,cs=[...document.getElementById("taskCats").selectedOptions].map(o=>o.value).slice(0,3),ds=[...document.querySelectorAll(".day.on")].map(e=>+e.dataset.i);if(!n||!cs.length||!ds.length)return toast("Choose a task, category and day");state.tasks.push({id:"u"+Date.now(),name:n,diff:d,cats:cs,days:ds});save();closeModal();render("schedule");toast("Task added 📅")}
function initModal(){document.getElementById("taskDiff").innerHTML=Object.entries(D).map(([k,v])=>'<option value="'+k+'">'+v[2]+' · '+v[0]+' XP</option>').join("");document.getElementById("taskCats").innerHTML=Object.entries(C).map(([k,v])=>'<option value="'+k+'">'+v[0]+' '+v[1]+'</option>').join("");document.getElementById("days").innerHTML=DAYS.map((d,i)=>'<button type="button" class="day '+(i===dayIndex?"on":"")+'" data-i="'+i+'" onclick="this.classList.toggle(\'on\')">'+d+'</button>').join("")}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.style.display="block";setTimeout(()=>e.style.display="none",1500)}
initModal();try{render();}catch(e){document.getElementById("app").innerHTML='<div class="top"><h1>Life Game 🎮</h1><div class="card"><h2>One little bug escaped 😅</h2><p class="sub">Refresh this page once. If it still happens, send me this screen and I’ll fix it.</p><button class="primary" onclick="location.reload()">Refresh</button></div></div>'}
</script></body></html>
